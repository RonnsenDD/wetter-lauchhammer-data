name: Wetterdaten Kostebrau aktualisieren

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Wetterdaten von Kostebrau abrufen
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime

          url = "https://wetter.lausitzlink.de/"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Lagezentrum-Lauchhammer/1.0"}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read().decode("utf-8", errors="replace")

          text = re.sub(r"(?is)<script.*?</script>", " ", raw)
          text = re.sub(r"(?is)<style.*?</style>", " ", text)
          text = re.sub(r"(?s)<[^>]+>", " ", text)
          text = html.unescape(text)
          text = re.sub(r"\s+", " ", text).strip()

          def extract(pattern):
              m = re.search(pattern, text, re.I | re.S)
              return m.group(1).strip() if m else None

          def number(value):
              if value is None:
                  return None
              try:
                  return float(value.replace(",", ".").strip())
              except ValueError:
                  return None

          measured = extract(r"(\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2}:\d{2})")
          temperature = number(extract(r"Außentemperatur\s+(-?\d+[,.]\d+)\s*°C"))
          humidity = extract(r"Luftfeuchte\s+(\d+)\s*%")
          pressure = number(extract(r"Luftdruck\s+(\d+[,.]\d+)\s*mbar"))

          wind = re.search(
              r"Windgeschwindigkeit\s+([0-9]+(?:[,.][0-9]+)?)\s*km/h\s*([A-Za-zÄÖÜäöüß]+)",
              text, re.I
          )
          gust = re.search(
              r"Böen\s+Geschwindigkeit\s+([0-9]+(?:[,.][0-9]+)?)\s*km/h\s*([A-Za-zÄÖÜäöüß]+)",
              text, re.I
          )

          wind_kmh = number(wind.group(1)) if wind else None
          wind_direction = wind.group(2).upper() if wind else None
          gust_kmh = number(gust.group(1)) if gust else None
          gust_direction = gust.group(2).upper() if gust else None

          rain_total_cm = number(extract(r"Regen\s+([0-9]+(?:[,.][0-9]+)?)\s*cm\s+Gesamt"))
          rain_rate_cm_h = number(extract(r"Regen-Rate\s+([0-9]+(?:[,.][0-9]+)?)\s*cm/h"))
          max_rain_rate_cm_h = number(extract(r"Max Regen-Rate\s+([0-9]+(?:[,.][0-9]+)?)\s*cm/h"))

          # Aktueller Wetterzustand aus dem DWD-ICON-Modell über Open-Meteo.
          # Die verwendeten weather_code-Werte entsprechen den WMO-Wettercodes.
          lat = 51.527833
          lon = 13.831333
          params = urllib.parse.urlencode({
              "latitude": lat,
              "longitude": lon,
              "current": "weather_code,is_day",
              "timezone": "Europe/Berlin"
          })
          weather_url = f"https://api.open-meteo.com/v1/dwd-icon?{params}"
          weather_req = urllib.request.Request(
              weather_url,
              headers={"User-Agent": "Lagezentrum-Lauchhammer/1.0"}
          )
          with urllib.request.urlopen(weather_req, timeout=30) as response:
              model_data = json.loads(response.read().decode("utf-8"))

          current_model = model_data.get("current", {})
          weather_code = current_model.get("weather_code")
          is_day = current_model.get("is_day")

          weather_map = {
              0: ("Klar", "☀️"),
              1: ("Heiter", "🌤️"),
              2: ("Teilweise bewölkt", "⛅"),
              3: ("Bewölkt", "☁️"),
              45: ("Nebel", "🌫️"),
              48: ("Nebel", "🌫️"),
              51: ("Leichter Nieselregen", "🌦️"),
              53: ("Nieselregen", "🌦️"),
              55: ("Starker Nieselregen", "🌧️"),
              56: ("Gefrierender Nieselregen", "🌧️"),
              57: ("Starker gefrierender Nieselregen", "🌧️"),
              61: ("Leichter Regen", "🌧️"),
              63: ("Regen", "🌧️"),
              65: ("Starker Regen", "🌧️"),
              66: ("Leichter gefrierender Regen", "🌧️"),
              67: ("Starker gefrierender Regen", "🌧️"),
              71: ("Leichter Schneefall", "❄️"),
              73: ("Schneefall", "❄️"),
              75: ("Starker Schneefall", "❄️"),
              77: ("Schneekörner", "🌨️"),
              80: ("Leichte Regenschauer", "🌦️"),
              81: ("Regenschauer", "🌦️"),
              82: ("Starke Regenschauer", "🌧️"),
              85: ("Leichte Schneeschauer", "🌨️"),
              86: ("Starke Schneeschauer", "🌨️"),
              95: ("Gewitter", "⛈️"),
              96: ("Gewitter mit Hagel", "⛈️"),
              99: ("Starkes Gewitter mit Hagel", "⛈️")
          }

          weather_description, weather_icon = weather_map.get(
              weather_code,
              ("Wetterlage unbekannt", "🌡️")
          )

          missing = []
          for name, value in [
              ("Temperatur", temperature),
              ("Luftfeuchte", humidity),
              ("Luftdruck", pressure),
              ("Wind", wind_kmh),
              ("Böen", gust_kmh),
              ("Regen", rain_total_cm),
              ("Regen-Rate", rain_rate_cm_h),
              ("Max Regen-Rate", max_rain_rate_cm_h),
              ("Wettercode", weather_code)
          ]:
              if value is None:
                  missing.append(name)

          if missing:
              raise SystemExit("Fehlende Werte: " + ", ".join(missing))

          result = {
              "location": {
                  "name": "Kostebrau, Lauchhammer",
                  "city": "Lauchhammer",
                  "latitude": lat,
                  "longitude": lon
              },
              "station": {
                  "name": "DB0LS, Kostebrau",
                  "software": "WeeWX",
                  "hardware": "WS1080"
              },
              "source": {
                  "provider": "Wetterstation Kostebrau / Lausitzlink",
                  "url": url
              },
              "weather": {
                  "code": weather_code,
                  "description": weather_description,
                  "icon": weather_icon,
                  "isDay": is_day,
                  "provider": "DWD ICON via Open-Meteo"
              },
              "measuredAt": (
                  datetime.strptime(measured, "%d.%m.%Y %H:%M:%S").isoformat()
                  if measured else None
              ),
              "temperatureC": temperature,
              "humidityPercent": int(humidity),
              "pressureHpa": pressure,
              "windKmh": wind_kmh,
              "windDirection": wind_direction,
              "gustKmh": gust_kmh,
              "gustDirection": gust_direction,
              "rainTotalCm": rain_total_cm,
              "rainRateCmH": rain_rate_cm_h,
              "maxRainRateCmH": max_rain_rate_cm_h,
              "status": "ok"
          }

          with open("weather.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Wetterdaten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet && exit 0
          git commit -m "Ergänzt aktuelle Wetterlage"
          git push
